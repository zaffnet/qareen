name: Pre-commit

# Versioning policy: Use major version tags for GitHub Actions (v5, v4) and exact patch versions for tools (uv@0.9.7)
# Exact patch pinning ensures reproducibility but prevents automatic security updates. Security updates must be managed manually by updating the pinned versions.

on:
  pull_request:
    branches: ['**']
  push:
    branches: [main]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.9.7"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # CI tests on 3.11 and 3.12 for guaranteed compatibility.
          # Package supports 3.13/3.14 but some deps (sentencepiece, PyTorch)
          # may lack prebuilt wheels; users must compile from source.
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run pre-commit
        run: uv run pre-commit run --all-files
