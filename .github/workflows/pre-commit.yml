name: Pre-commit

# Versioning policy: Use major version tags for GitHub Actions (v5, v4) and exact patch versions for tools (uv@0.9.7)
# This ensures reproducibility while allowing security updates within major versions.

on:
  pull_request:
    branches: ['**']
  push:
    branches: [main]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.9.7"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run pre-commit
        run: uv run pre-commit run --all-files
