name: Code Review

on:
    pull_request:
        types: [opened, synchronize, reopened, ready_for_review]

permissions:
    pull-requests: write
    contents: read
    issues: write

jobs:
  code-review:
    concurrency:
      group: code-review-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      BLOCKING_REVIEW: ${{ vars.BLOCKING_REVIEW || 'false' }}
    runs-on: ubuntu-latest # Skip automated code review for draft PRs
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Validate BLOCKING_REVIEW variable
        run: |
          if [ "$BLOCKING_REVIEW" != "true" ] && [ "$BLOCKING_REVIEW" != "false" ]; then
            echo "❌ Error: BLOCKING_REVIEW must be either 'true' or 'false'"
            echo "   Current value: '$BLOCKING_REVIEW'"
            echo "   Please set the BLOCKING_REVIEW repository variable to 'true' or 'false'"
            exit 1
          fi
          echo "✅ BLOCKING_REVIEW validated: $BLOCKING_REVIEW"

      - name: Cache Cursor CLI
        id: cache-cursor
        uses: actions/cache@v4
        with:
          path: ~/.cursor
          key: cursor-cli-${{ runner.os }}-v1

      - name: Verify cached Cursor CLI
        id: verify-cache
        if: steps.cache-cursor.outputs.cache-hit == 'true'
        continue-on-error: true
        run: |
          export PATH="$HOME/.cursor/bin:$PATH"
          if [ ! -x "$HOME/.cursor/bin/cursor" ]; then
            echo "Warning: Cached Cursor CLI binary not found or not executable"
            echo "cache-valid=false" >> $GITHUB_OUTPUT
            exit 1
          fi
          if ! cursor --version > /dev/null 2>&1 && ! cursor --help > /dev/null 2>&1; then
            echo "Warning: Cached Cursor CLI failed to run"
            echo "cache-valid=false" >> $GITHUB_OUTPUT
            exit 1
          fi
          echo "✅ Cached Cursor CLI verified successfully"
          echo "cache-valid=true" >> $GITHUB_OUTPUT

      - name: Install Cursor CLI
        if: steps.cache-cursor.outputs.cache-hit != 'true' || (steps.verify-cache.outcome == 'failure')
        run: |
          set -e
          curl --fail --show-error -fsS https://cursor.com/install -o /tmp/cursor-install.sh
          curl --fail --show-error -fsS https://cursor.com/install.sha256 -o /tmp/cursor-install.sh.sha256 || {
            echo "Error: Failed to download checksum file"
            rm -f /tmp/cursor-install.sh /tmp/cursor-install.sh.sha256
            exit 1
          }
          if [ ! -s /tmp/cursor-install.sh ]; then
            echo "Error: Downloaded installer is empty"
            rm -f /tmp/cursor-install.sh /tmp/cursor-install.sh.sha256
            exit 1
          fi
          INSTALLER_SHA256=$(sha256sum /tmp/cursor-install.sh | cut -d' ' -f1)
          EXPECTED_SHA256=$(cat /tmp/cursor-install.sh.sha256 | cut -d' ' -f1)
          if [ "$INSTALLER_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "Error: Installer checksum verification failed"
            echo "Expected: $EXPECTED_SHA256"
            echo "Got: $INSTALLER_SHA256"
            rm -f /tmp/cursor-install.sh /tmp/cursor-install.sh.sha256
            exit 1
          fi
          chmod +x /tmp/cursor-install.sh
          bash /tmp/cursor-install.sh
          rm -f /tmp/cursor-install.sh /tmp/cursor-install.sh.sha256
          if [ ! -x "$HOME/.cursor/bin/cursor" ]; then
            echo "Error: Cursor CLI binary not found after installation"
            echo "Checking installation directory:"
            ls -la "$HOME/.cursor/bin" || echo "Directory does not exist"
            exit 1
          fi

      - name: Add Cursor to PATH
        run: |
          echo "$HOME/.cursor/bin" >> $GITHUB_PATH

      - name: Verify Cursor CLI installation
        run: |
          export PATH="$HOME/.cursor/bin:$PATH"
          if [ ! -d "$HOME/.cursor/bin" ]; then
            echo "Error: Cursor bin directory does not exist"
            exit 1
          fi
          if [ ! -x "$HOME/.cursor/bin/cursor" ]; then
            echo "Error: Cursor CLI binary not found or not executable"
            ls -la "$HOME/.cursor/bin" || true
            exit 1
          fi
          if ! which cursor > /dev/null 2>&1; then
            echo "Error: cursor command not found in PATH"
            echo "PATH: $PATH"
            exit 1
          fi
          if ! cursor --version > /dev/null 2>&1 && ! cursor --help > /dev/null 2>&1; then
            echo "Error: Cursor CLI failed to run"
            exit 1
          fi
          echo "✅ Cursor CLI verified successfully"
          cursor --version || cursor --help

      - name: Configure git identity
        run: |
          git config user.name "Cursor Agent"
          git config user.email "cursoragent@cursor.com"

      - name: Validate CURSOR_API_KEY
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          if [ -z "$CURSOR_API_KEY" ]; then
            echo "❌ Error: CURSOR_API_KEY secret is not configured"
            echo "   Please set the CURSOR_API_KEY repository secret in GitHub Settings > Secrets and variables > Actions"
            exit 1
          fi
          echo "✅ CURSOR_API_KEY validated successfully"

      - name: Perform automated code review
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          MODEL: gpt-5
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export PATH="$HOME/.cursor/bin:$PATH"
          if ! command -v cursor > /dev/null 2>&1; then
            echo "Error: cursor command not found in PATH"
            echo "PATH: $PATH"
            echo "Checking installation:"
            ls -la "$HOME/.cursor/bin" || true
            exit 1
          fi
          cursor agent --force --model "$MODEL" --output-format=text --print <<PROMPT_END
          You are operating in a GitHub Actions runner performing automated code review. The gh CLI is available and authenticated via GH_TOKEN. You may comment on pull requests.

          Context:
          - Repo: ${{ github.repository }}
          - PR Number: ${{ github.event.pull_request.number }}
          - PR Head SHA: ${{ github.event.pull_request.head.sha }}
          - PR Base SHA: ${{ github.event.pull_request.base.sha }}
          - Blocking Review: ${{ env.BLOCKING_REVIEW }}

          Objectives:
          1) Re-check existing review comments and reply resolved when addressed.
          2) Review the current PR diff and flag only clear, high-severity issues.
          3) Leave very short inline comments (1-2 sentences) on changed lines only and a brief summary at the end.

          Procedure:
          - Get existing comments: gh pr view --json comments
          - Get diff: gh pr diff
          - Get changed files with patches to compute inline positions: gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files --paginate --jq '.[] | {filename,patch}'
          - Compute exact inline anchors for each issue (file path + diff position). Comments MUST be placed inline on the changed line in the diff, not as top-level comments.
          - Detect prior top-level "no issues" style comments authored by this bot (match bodies like: "✅ no issues", "No issues found", "LGTM").
          - If CURRENT run finds issues and any prior "no issues" comments exist:
            - Prefer to remove them to avoid confusion:
              - Delete top-level issue comments via: gh api -X DELETE repos/${{ github.repository }}/issues/comments/<comment_id> (do not mask failures with || true; handle errors explicitly)
              - If deletion fails (e.g., comment already deleted or insufficient permissions), minimize them via GraphQL (minimizeComment) or edit to prefix "[Superseded by new findings]".
            - If neither delete nor minimize is possible, reply to that comment: "⚠️ Superseded: issues were found in newer commits".
          - If a previously reported issue appears fixed by nearby changes, reply: ✅ This issue appears to be resolved by the recent changes
          - Analyze ONLY for:
            - Null/undefined dereferences
            - Resource leaks (unclosed files or connections)
            - Injection (SQL/XSS)
            - Concurrency/race conditions
            - Missing error handling for critical operations
            - Obvious logic errors with incorrect behavior
            - Clear performance anti-patterns with measurable impact
            - Definitive security vulnerabilities
          - Avoid duplicates: skip if similar feedback already exists on or near the same lines.

          Commenting rules:
          - Max 10 inline comments total; prioritize the most critical issues
          - One issue per comment; place on the exact changed line
          - All issue comments MUST be inline (anchored to a file and line/position in the PR diff)
          - Natural tone, specific and actionable; do not mention automated or high-confidence
          - Use emojis: 🚨 Critical 🔒 Security ⚡ Performance ⚠️ Logic ✅ Resolved ✨ Improvement

          Submission:
          - If there are NO issues to report and an existing top-level comment indicating "no issues" already exists (e.g., "✅ no issues", "No issues found", "LGTM"), do NOT submit another comment. Skip submission to avoid redundancy.
          - If there are NO issues to report and NO prior "no issues" comment exists, submit one brief summary comment noting no issues.
          - If there ARE issues to report and a prior "no issues" comment exists, ensure that prior comment is deleted/minimized/marked as superseded before submitting the new review.
          - If there ARE issues to report, submit ONE review containing ONLY inline comments plus an optional concise summary body. Use the GitHub Reviews API to ensure comments are inline:
            - Build a JSON array of comments like: [{ "path": "<file>", "position": <diff_position>, "body": "..." }]
            - Submit via: gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews -f event=COMMENT -f body="$SUMMARY" -f comments='[$COMMENTS_JSON]'
          - Do NOT use: gh pr review --approve or --request-changes

          Blocking behavior:
          - If BLOCKING_REVIEW is true and any 🚨 or 🔒 issues were posted: echo "CRITICAL_ISSUES_FOUND=true" >> $GITHUB_ENV
          - Otherwise: echo "CRITICAL_ISSUES_FOUND=false" >> $GITHUB_ENV
          - Always set CRITICAL_ISSUES_FOUND at the end
          PROMPT_END

      - name: Check blocking review results
        if: env.BLOCKING_REVIEW == 'true'
        run: |
          echo "Checking for critical issues..."
          echo "CRITICAL_ISSUES_FOUND: ${CRITICAL_ISSUES_FOUND:-unset}"

          if [ "${CRITICAL_ISSUES_FOUND:-false}" = "true" ]; then
            echo "❌ Critical issues found and blocking review is enabled. Failing the workflow."
            exit 1
          else
            echo "✅ No blocking issues found."
          fi
