[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["qareen*"]

[project]
name = "qareen"
version = "0.1.0"
description = "A tool for analyzing and optimizing multimodal few-shot example selection"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Zafarullah Mahmood", email = "zafar@zafarmahmood.com"}
]
maintainers = [
    {name = "Zafarullah Mahmood", email = "zafar@zafarmahmood.com"}
]
dependencies = [
    "gradio~=4.0.0",
    "transformers~=4.57.0",
    "numpy~=1.26.0",
    "pandas~=2.2.0",
    "sentence-transformers~=5.1.0",
    "datasets>=2.21.0",
    "langchain>=0.2.0",
    "langchain-chroma>=0.1.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.5.0",
    "pillow>=10.4.0",
]

[project.optional-dependencies]
# Note: The 'gpu' extra is currently a placeholder (empty) and does not install
# any GPU-specific packages. For GPU support, you must install a CUDA-enabled PyTorch
# build from https://pytorch.org/get-started/locally/ BEFORE installing qareen.
# The package will check at runtime and warn if CUDA is not available.
# The base package will work with CPU-only PyTorch (installed automatically via
# transformers/sentence-transformers dependencies).
gpu = []
dev = [
    "pytest~=8.0.0",
    "ruff>=0.14.5",
    "mypy~=1.8.0",
    "pre-commit~=3.7.0",
]

[project.urls]
Homepage = "https://github.com/zaffnet/qareen"
Repository = "https://github.com/zaffnet/qareen"
Documentation = "https://github.com/zaffnet/qareen#readme"
Issues = "https://github.com/zaffnet/qareen/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]

extend-select = ["E501"]  # line-too-long: Ruff omits rules that overlap with formatters by default

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_optional = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "gradio.*",
    "transformers.*",
    "sentence_transformers.*",
]
ignore_missing_imports = true
